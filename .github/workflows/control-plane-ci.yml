name: control-plane CI

on:
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-ci.yml"
  push:
    branches: [feature/control-plane]
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oplia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: System packages (python-ldap build headers, OpenLDAP for AD-driver integration tests)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q libldap-dev libsasl2-dev slapd ldap-utils
          sudo systemctl stop slapd || true
          # the packaged AppArmor profile only allows slapd's default paths; the test server runs from RUNNER_TEMP
          if [ -f /etc/apparmor.d/usr.sbin.slapd ]; then sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd || true; fi
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,postgres,gcp,ad]"
      - name: Start test LDAP server
        run: scripts/test-slapd.sh "$RUNNER_TEMP/slapd" | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Lint
        run: ruff check src tests migrations
      - name: Type check
        run: mypy
      - name: Security scan
        run: bandit -r src -q
      - name: Tests (SQLite)
        run: pytest -rs
      - name: Tests (PostgreSQL, schema from migrations)
        env:
          OPLIA_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/oplia_test
        run: pytest -rs
      - name: Migrations match models
        env:
          OPLIA_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/oplia_test
        run: alembic upgrade head && alembic check

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t oplia-control-plane:ci control-plane
      - name: Smoke test image
        run: |
          docker run --rm --user 1001 oplia-control-plane:ci python -c "import oplia_ctl.main, oplia_ctl.soar.exporter, oplia_ctl.finops.config, google.cloud.asset_v1, google.cloud.compute_v1, azure.mgmt.compute, oplia_ctl.identity.config, oplia_ctl.identity.providers.ad, ldap; print('import ok, python-ldap', ldap.__version__, 'OpenLDAP', ldap.VENDOR_VERSION)"
          for cmd in oplia-finops-scan oplia-finops-optimize oplia-aiops-escalator oplia-jit-worker oplia-identity-sweep; do
            docker run --rm --user 1001 oplia-control-plane:ci "$cmd" --help > /dev/null
          done

  monitoring-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: control-plane/examples/aiops
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: download promtool and amtool (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for r in "prometheus v3.5.0" "alertmanager v0.28.1"; do
            set -- $r; v=${2#v}; f=$1-$v.linux-amd64.tar.gz
            curl -sSfLO "https://github.com/prometheus/$1/releases/download/$2/$f"
            curl -sSfL "https://github.com/prometheus/$1/releases/download/$2/sha256sums.txt" | grep " $f\$" | sha256sum -c -
            tar xzf "$f"
          done
          echo "$RUNNER_TEMP/prometheus-3.5.0.linux-amd64" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/alertmanager-0.28.1.linux-amd64" >> "$GITHUB_PATH"
      - name: promtool check and unit-test rules
        run: |
          promtool check rules prometheus-rules.example.yaml
          promtool test rules prometheus-rules.test.yaml
      - name: amtool check receiver fragment
        run: |
          set -euo pipefail
          printf 'token' > "$RUNNER_TEMP/token"
          python3 - "$RUNNER_TEMP" <<'PY'
          import sys, yaml
          d = yaml.safe_load(open("alertmanager-receiver.yaml"))
          d["route"]["receiver"] = "oplia-aiops"
          d["receivers"][0]["webhook_configs"][0]["http_config"]["authorization"]["credentials_file"] = sys.argv[1] + "/token"
          open(sys.argv[1] + "/am.yml", "w").write(yaml.safe_dump(d))
          PY
          amtool check-config "$RUNNER_TEMP/am.yml"

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-plane/terraform
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
      - name: validate modules and example root
        run: |
          set -euo pipefail
          for d in modules/aws-state-backend modules/azure-state-backend examples/state-backends; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: checkov
        run: |
          python -m pip install --quiet "checkov==3.2.*"
          checkov -d . --framework terraform --compact --quiet
