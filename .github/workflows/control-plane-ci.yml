name: control-plane CI

on:
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-ci.yml"
  push:
    branches: [feature/control-plane]
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oplia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: System packages (python-ldap build headers, OpenLDAP for AD-driver integration tests)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q libldap-dev libsasl2-dev slapd ldap-utils shellcheck
          sudo systemctl stop slapd || true
          # the packaged AppArmor profile only allows slapd's default paths; the test server runs from RUNNER_TEMP
          if [ -f /etc/apparmor.d/usr.sbin.slapd ]; then sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd || true; fi
          # MySQL 8 for the DR read-only-lock integration test (runner image ships mysqld; profile limits datadir)
          sudo systemctl stop mysql || true
          if [ -f /etc/apparmor.d/usr.sbin.mysqld ]; then sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld || true; fi
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,postgres,gcp,ad,dr]"
      - name: Start test LDAP server
        run: scripts/test-slapd.sh "$RUNNER_TEMP/slapd" | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Start test MySQL server
        run: scripts/test-mysql.sh "$RUNNER_TEMP/mysql" | sed 's/^export //' >> "$GITHUB_ENV"
      - name: OpenBao 2.5.3 for the Vault driver tests (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          base=https://github.com/openbao/openbao/releases/download/v2.5.3
          curl -sSfLO "$base/bao_2.5.3_Linux_x86_64.tar.gz"
          curl -sSfL "$base/checksums-linux.txt" | grep " bao_2.5.3_Linux_x86_64.tar.gz$" | sha256sum -c -
          mkdir -p bao-bin && tar xzf bao_2.5.3_Linux_x86_64.tar.gz -C bao-bin bao
          echo "$RUNNER_TEMP/bao-bin" >> "$GITHUB_PATH"
      - name: Start test OpenBao server
        run: |
          set -euo pipefail
          out=$(BAO_BIN="$RUNNER_TEMP/bao-bin/bao" scripts/test-openbao.sh "$RUNNER_TEMP/bao")
          echo "::add-mask::$(echo "$out" | sed -n 's/^export BAO_TOKEN=//p')"
          echo "$out" | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Shell scripts (shellcheck)
        run: shellcheck scripts/*.sh deploy/vault/scripts/*.sh
      - name: Lint
        run: ruff check src tests migrations
      - name: Type check
        run: mypy
      - name: Security scan
        run: bandit -r src -q
      - name: Tests (SQLite)
        run: pytest -rs
      - name: Vault deploy scripts against OpenBao and PostgreSQL
        env:
          VAULT_CLI: bao
          OPLIA_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/oplia_test
        run: scripts/test-vault-deploy.sh
      - name: Tests (PostgreSQL, schema from migrations)
        env:
          OPLIA_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/oplia_test
        run: pytest -rs
      - name: Migrations match models
        env:
          OPLIA_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/oplia_test
        run: alembic upgrade head && alembic check

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-plane/console
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Install (lockfile, pinned npm)
        run: npx -y npm@11.21.1 ci --no-fund
      - name: Dependency audit
        run: npx -y npm@11.21.1 audit --audit-level=low
      - name: Type check (strict)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npx vite build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t oplia-control-plane:ci control-plane
      - name: Smoke test image
        run: |
          docker run --rm --user 1001 oplia-control-plane:ci python -c "import oplia_ctl.main, oplia_ctl.soar.exporter, oplia_ctl.finops.config, google.cloud.asset_v1, google.cloud.compute_v1, azure.mgmt.compute, oplia_ctl.identity.config, oplia_ctl.identity.providers.ad, oplia_ctl.dr.config, sqlglot, bson, confluent_kafka, pymysql, ldap; print('import ok, python-ldap', ldap.__version__, 'OpenLDAP', ldap.VENDOR_VERSION)"
          for cmd in oplia-finops-scan oplia-finops-optimize oplia-aiops-escalator oplia-jit-worker oplia-identity-sweep oplia-dr-breaker; do
            docker run --rm --user 1001 oplia-control-plane:ci "$cmd" --help > /dev/null
          done

  monitoring-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: control-plane/examples/aiops
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: download promtool and amtool (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for r in "prometheus v3.5.0" "alertmanager v0.28.1"; do
            set -- $r; v=${2#v}; f=$1-$v.linux-amd64.tar.gz
            curl -sSfLO "https://github.com/prometheus/$1/releases/download/$2/$f"
            curl -sSfL "https://github.com/prometheus/$1/releases/download/$2/sha256sums.txt" | grep " $f\$" | sha256sum -c -
            tar xzf "$f"
          done
          echo "$RUNNER_TEMP/prometheus-3.5.0.linux-amd64" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/alertmanager-0.28.1.linux-amd64" >> "$GITHUB_PATH"
      - name: promtool check and unit-test rules
        run: |
          promtool check rules prometheus-rules.example.yaml
          promtool test rules prometheus-rules.test.yaml
      - name: amtool check receiver fragment
        run: |
          set -euo pipefail
          printf 'token' > "$RUNNER_TEMP/token"
          python3 - "$RUNNER_TEMP" <<'PY'
          import sys, yaml
          d = yaml.safe_load(open("alertmanager-receiver.yaml"))
          d["route"]["receiver"] = "oplia-aiops"
          d["receivers"][0]["webhook_configs"][0]["http_config"]["authorization"]["credentials_file"] = sys.argv[1] + "/token"
          open(sys.argv[1] + "/am.yml", "w").write(yaml.safe_dump(d))
          PY
          amtool check-config "$RUNNER_TEMP/am.yml"

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: control-plane/deploy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: download kustomize and kubeconform (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -sSfLO https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/CHECKSUMS | grep " kubeconform-linux-amd64.tar.gz$" | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          curl -sSfLO https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/checksums.txt | grep " kustomize_v5.4.3_linux_amd64.tar.gz$" | sha256sum -c -
          tar xzf kustomize_v5.4.3_linux_amd64.tar.gz
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: build and validate every kustomization (strict, Kubernetes 1.30)
        run: |
          set -euo pipefail
          for k in $(find . -name kustomization.yaml -not -path "*/base/*" -exec dirname {} \; | sort); do
            echo "::group::$k"
            kustomize build "$k" | kubeconform -strict -summary -kubernetes-version 1.30.0 -skip ServiceExport -
            echo "::endgroup::"
          done
          kubeconform -strict -summary -kubernetes-version 1.30.0 vault/k8s/token-reviewer.yaml
      - name: CDC connector configs are valid JSON
        run: for f in dr/cdc/*.json; do python3 -m json.tool "$f" > /dev/null; done
      - name: OTel sidecar config loads in the pinned collector (otelcol validate)
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          # the block scalar under "config.yaml: |" (indented 4 spaces) is the collector config
          awk 'f && /^    /{print substr($0,5); next} f && !/^[[:space:]]*$/{f=0} /^  config.yaml: \|/{f=1}' \
            apps/base/otel-collector-config.yaml > "$d/config.yaml"
          test -s "$d/config.yaml"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=otel-test -keyout "$d/ca.key" -out "$d/ca.crt" 2>/dev/null
          chmod 0644 "$d"/*
          docker run --rm -v "$d/config.yaml:/cfg/config.yaml:ro" -v "$d/ca.crt:/etc/otel/ca/ca.crt:ro" \
            otel/opentelemetry-collector:0.163.2 validate --config=/cfg/config.yaml

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-plane/terraform
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
      - name: validate modules and example root
        run: |
          set -euo pipefail
          for d in modules/aws-state-backend modules/azure-state-backend examples/state-backends; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: checkov
        run: |
          python -m pip install --quiet "checkov==3.2.*"
          checkov -d . --framework terraform --compact --quiet
