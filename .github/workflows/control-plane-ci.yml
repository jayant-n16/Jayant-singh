name: control-plane CI

on:
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-ci.yml"
  push:
    branches: [feature/control-plane]
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oplia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,postgres]"
      - name: Lint
        run: ruff check src tests migrations
      - name: Type check
        run: mypy
      - name: Security scan
        run: bandit -r src -q
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL, schema from migrations)
        env:
          OPLIA_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/oplia_test
        run: pytest
      - name: Migrations match models
        env:
          OPLIA_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/oplia_test
        run: alembic upgrade head && alembic check

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t oplia-control-plane:ci control-plane
      - name: Smoke test image
        run: |
          docker run --rm --user 1001 oplia-control-plane:ci python -c "import oplia_ctl.main, oplia_ctl.soar.exporter; print('import ok')"

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-plane/terraform
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
      - name: validate modules and example root
        run: |
          set -euo pipefail
          for d in modules/aws-state-backend modules/azure-state-backend examples/state-backends; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: checkov
        run: |
          python -m pip install --quiet "checkov==3.2.*"
          checkov -d . --framework terraform --compact --quiet
