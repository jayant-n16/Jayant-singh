# One breaker per replication stream. Exactly one replica (Recreate): the rolling rate baseline is
# kept in memory, and two consumers would split the stream between two baselines.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oplia-dr-breaker-orders
  labels:
    app.kubernetes.io/name: oplia-dr-breaker
    oplia.io/stream: orders-pg
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oplia-dr-breaker
      oplia.io/stream: orders-pg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oplia-dr-breaker
        oplia.io/stream: orders-pg
    spec:
      serviceAccountName: oplia-dr-breaker
      automountServiceAccountToken: false   # no API-server credentials; the Vault login token is projected below
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: breaker
          image: oplia-control-plane:REPLACE_WITH_RELEASE   # the control-plane image, pinned by digest
          command: ["oplia-dr-breaker"]
          envFrom:
            - configMapRef:
                name: oplia-dr-orders          # OPLIA_DR_* settings (see examples/dr/dr.env.example)
            - configMapRef:
                name: oplia-vault              # OPLIA_VAULT_* (see examples/vault/vault.env.example)
            - secretRef:
                name: oplia-control-plane-env  # OPLIA_DATABASE_URL only; every other secret comes from Vault
          env:
            - name: OPLIA_DR_QUARANTINE_DIR
              value: /var/lib/oplia/dr-quarantine
            - name: OPLIA_SECRET_PROVIDER
              value: vault
            - name: OPLIA_VAULT_AUTH_METHOD
              value: kubernetes
            - name: OPLIA_VAULT_KUBERNETES_ROLE
              value: oplia-control-plane
            - name: OPLIA_VAULT_KUBERNETES_JWT_FILE
              value: /var/run/secrets/vault/token
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: quarantine
              mountPath: /var/lib/oplia/dr-quarantine
            - name: tmp
              mountPath: /tmp
            - name: vault-token                # short-lived, auto-rotated token used only for Vault login
              mountPath: /var/run/secrets/vault
              readOnly: true
      volumes:
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
        - name: quarantine
          persistentVolumeClaim:
            claimName: oplia-dr-quarantine
        - name: tmp
          emptyDir: {}
