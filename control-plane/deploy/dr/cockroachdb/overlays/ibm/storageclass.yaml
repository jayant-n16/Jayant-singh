apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: oplia-crdb-ssd
provisioner: vpc.block.csi.ibm.io
parameters:
  profile: 10iops-tier
  encrypted: "false"   # set "true" with encryptionKey (Key Protect CRN) for customer-managed keys
reclaimPolicy: Retain          # never delete database volumes with the claim
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
