apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: oplia-crdb-ssd
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  iops: "6000"
  throughput: "250"
reclaimPolicy: Retain          # never delete database volumes with the claim
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
