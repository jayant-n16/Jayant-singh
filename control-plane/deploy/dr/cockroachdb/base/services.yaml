# Headless service: stable per-pod DNS for the StatefulSet. Exported to the other clouds through
# Kubernetes Multi-Cluster Services (ServiceExport, see overlays) so nodes can join across clouds.
apiVersion: v1
kind: Service
metadata:
  name: cockroachdb
spec:
  clusterIP: None
  publishNotReadyAddresses: true   # nodes must find each other before they are ready
  ports:
    - name: grpc
      port: 26257
      targetPort: 26257
    - name: http
      port: 8080
      targetPort: 8080
---
# Client entry point inside this cloud (SQL + DB console).
apiVersion: v1
kind: Service
metadata:
  name: cockroachdb-public
spec:
  ports:
    - name: grpc
      port: 26257
      targetPort: 26257
    - name: http
      port: 8080
      targetPort: 8080
