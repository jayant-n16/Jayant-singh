# API: 2 replicas behind a Service; the schema is migrated by the Job in the same release (alembic upgrade head).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oplia-api
  labels:
    app.kubernetes.io/name: oplia-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oplia-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oplia-api
    spec:
      serviceAccountName: oplia-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: oplia-control-plane:REPLACE_WITH_RELEASE   # pin by digest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          envFrom:
            - configMapRef:
                name: oplia-config             # OPLIA_* non-secret settings (OIDC, CI/CD target, phase settings)
            - configMapRef:
                name: oplia-vault              # OPLIA_VAULT_* (examples/vault/vault.env.example)
            - secretRef:
                name: oplia-control-plane-env  # OPLIA_DATABASE_URL only; every other secret comes from Vault
          env:
            - name: OPLIA_SECRET_PROVIDER
              value: vault
            - name: OPLIA_VAULT_AUTH_METHOD
              value: kubernetes
            - name: OPLIA_VAULT_KUBERNETES_ROLE
              value: oplia-api
            - name: OPLIA_VAULT_KUBERNETES_JWT_FILE
              value: /var/run/secrets/vault/token
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: vault-token            # short-lived, auto-rotated token used only for the Vault login
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: oplia-api
spec:
  selector:
    app.kubernetes.io/name: oplia-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oplia-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oplia-api
---
apiVersion: batch/v1
kind: Job
metadata:
  name: oplia-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: oplia-control-plane
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: oplia-control-plane:REPLACE_WITH_RELEASE   # pin by digest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: oplia-config             # OPLIA_* non-secret settings (OIDC, CI/CD target, phase settings)
            - configMapRef:
                name: oplia-vault              # OPLIA_VAULT_* (examples/vault/vault.env.example)
            - secretRef:
                name: oplia-control-plane-env  # OPLIA_DATABASE_URL only; every other secret comes from Vault
          env:
            - name: OPLIA_SECRET_PROVIDER
              value: vault
            - name: OPLIA_VAULT_AUTH_METHOD
              value: kubernetes
            - name: OPLIA_VAULT_KUBERNETES_ROLE
              value: oplia-control-plane
            - name: OPLIA_VAULT_KUBERNETES_JWT_FILE
              value: /var/run/secrets/vault/token
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: vault-token            # short-lived, auto-rotated token used only for the Vault login
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
