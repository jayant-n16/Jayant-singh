---
# advances approved image replication jobs one persisted step at a time
# DR consistency: compare every DR copy (dr_of) with its source; drift raises a dr.resync proposal.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oplia-dr-job-worker
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: oplia-control-plane
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: job
              image: oplia-control-plane:REPLACE_WITH_RELEASE   # pin by digest
              command: ["oplia-dr-job-worker"]   # restore drills and the other persisted DR jobs
              envFrom:
                - configMapRef:
                    name: oplia-config             # OPLIA_* non-secret settings (OIDC, CI/CD target, phase settings)
                - configMapRef:
                    name: oplia-vault              # OPLIA_VAULT_* (examples/vault/vault.env.example)
                - secretRef:
                    name: oplia-control-plane-env  # OPLIA_DATABASE_URL only; every other secret comes from Vault
              env:
                - name: OPLIA_SECRET_PROVIDER
                  value: vault
                - name: OPLIA_VAULT_AUTH_METHOD
                  value: kubernetes
                - name: OPLIA_VAULT_KUBERNETES_ROLE
                  value: oplia-control-plane
                - name: OPLIA_VAULT_KUBERNETES_JWT_FILE
                  value: /var/run/secrets/vault/token
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: vault-token
                  mountPath: /var/run/secrets/vault
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: vault-token            # short-lived, auto-rotated token used only for the Vault login
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 3600
