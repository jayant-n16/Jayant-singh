# Bound in Vault by the Kubernetes auth role "oplia-control-plane" (deploy/vault/scripts/vault-roles.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oplia-control-plane
automountServiceAccountToken: false
---
# The API only. Bound in Vault by the Kubernetes auth role "oplia-api", which adds the oplia-settings-writer
# policy (secrets entered in the console). Workers and CronJobs keep oplia-control-plane (read-only secrets).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oplia-api
automountServiceAccountToken: false
