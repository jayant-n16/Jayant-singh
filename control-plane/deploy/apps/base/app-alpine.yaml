# Alpine-based app. The Vault agent runs in its own container (Vault image); the app only reads /vault/secrets/db.env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-alpine
  labels:
    app.kubernetes.io/name: checkout-alpine
    tags.datadoghq.com/env: production        # Datadog unified service tagging
    tags.datadoghq.com/service: checkout-alpine
    tags.datadoghq.com/version: "1.0.0"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-alpine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-alpine
        tags.datadoghq.com/env: production
        tags.datadoghq.com/service: checkout-alpine
        tags.datadoghq.com/version: "1.0.0"
      annotations:
        # --- Vault Agent Injector (annotation names verified against hashicorp/vault-k8s source)
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "app-prod"
        vault.hashicorp.com/auth-path: "auth/kubernetes-aws"           # set per cloud by the overlay
        vault.hashicorp.com/agent-image: "hashicorp/vault:2.2.1"       # pin by digest
        vault.hashicorp.com/agent-pre-populate: "true"                 # credentials exist before the app starts
        vault.hashicorp.com/agent-run-as-same-user: "true"             # agent writes files as the app's UID
        vault.hashicorp.com/agent-revoke-on-shutdown: "true"           # lease revoked when the pod stops
        vault.hashicorp.com/agent-requests-cpu: "50m"
        vault.hashicorp.com/agent-requests-mem: "64Mi"
        vault.hashicorp.com/agent-limits-mem: "128Mi"
        vault.hashicorp.com/agent-inject-secret-db.env: "database/creds/app-prod-postgres"
        vault.hashicorp.com/agent-inject-perms-db.env: "0400"
        vault.hashicorp.com/agent-inject-template-db.env: |
          {{- with secret "database/creds/app-prod-postgres" -}}
          PGUSER={{ .Data.username }}
          PGPASSWORD={{ .Data.password }}
          {{- end }}
        # --- Prometheus (kubernetes_sd "pods" scraping convention)
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: "/metrics"
        # --- Datadog Autodiscovery: scrape the same OpenMetrics endpoint (node Agent DaemonSet)
        ad.datadoghq.com/app.checks: |
          {"openmetrics": {"instances": [{"openmetrics_endpoint": "http://%%host%%:9102/metrics",
                                          "namespace": "checkout-alpine", "metrics": [".*"]}]}}
        # --- Dynatrace Operator: inject OneAgent code modules into this pod
        oneagent.dynatrace.com/inject: "true"
    spec:
      serviceAccountName: app-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: checkout-alpine
      containers:
        - name: app
          image: app-alpine
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9102
          env:
            - name: DB_CREDENTIALS_FILE           # the app reads its credentials from this file
              value: /vault/secrets/db.env
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # to the collector sidecar, never off-pod directly
              value: http://127.0.0.1:4317
            - name: OTEL_SERVICE_NAME
              value: checkout-alpine
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: otel-collector
          image: otel/opentelemetry-collector:0.163.2   # pin by digest
          args: ["--config=/etc/otel/config.yaml"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel
              readOnly: true
            - name: otel-ca
              mountPath: /etc/otel/ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: otel-config
          configMap:
            name: otel-sidecar-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: otel-ca
          configMap:
            name: otel-gateway-ca     # CA of the OTel gateway (created by the observability team)
