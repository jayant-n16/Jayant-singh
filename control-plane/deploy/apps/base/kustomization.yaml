apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - serviceaccount.yaml
  - otel-collector-config.yaml
  - app-alpine.yaml
  - app-ubuntu.yaml
  - app-distroless.yaml
# your application images (one per base-image family); pin by digest in your pipeline
images:
  - name: app-alpine
    newName: registry.example.com/shop/checkout-alpine
    newTag: "1.0.0"
  - name: app-ubuntu
    newName: registry.example.com/shop/checkout-ubuntu
    newTag: "1.0.0"
  - name: app-distroless
    newName: registry.example.com/shop/checkout-distroless
    newTag: "1.0.0"
