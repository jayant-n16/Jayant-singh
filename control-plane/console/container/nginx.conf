# OPLIA console: serves the built single-page app and forwards /api/ to the control-plane API
# (same origin: no CORS, the access token never goes to another host).
# Runs as a non-root user with a read-only root filesystem: everything written goes to /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  log_format main '$remote_addr - [$time_iso8601] "$request_method $uri $server_protocol" $status '
                  '$body_bytes_sent $request_time "$http_user_agent"';  # no query strings: OAuth codes stay out of logs
  access_log /dev/stdout main;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # generated at start-up by oplia-console-start from the OPLIA_CONSOLE_* variables
  include /tmp/oplia/server.conf;
}
