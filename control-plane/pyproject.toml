[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oplia-control-plane"
version = "0.1.0"
description = "OPLIA multi-cloud control plane: guarded remediation, SOAR export, IaC lifecycle, AIOps, FinOps, JIT access, DR circuit breaker."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyjwt[crypto]>=2.8",
  "boto3>=1.34",
  "azure-identity>=1.16",
  "azure-mgmt-network>=25.3",
  "azure-mgmt-resource>=23.0",
  "kubernetes>=29.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
  "moto[ec2]>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "bandit>=1.7",
  "pyyaml>=6.0",
  "types-PyYAML",
]

[project.scripts]
oplia-soar-exporter = "oplia_ctl.soar.exporter:main"
oplia-iac-lifecycle = "oplia_ctl.lifecycle.manager:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]
ignore = ["S101"]  # assert is used in tests only

[tool.ruff.lint.per-file-ignores]
# Test stubs mirror boto3 keyword names (InstanceIds, ...) because the real API passes them by name.
"tests/*" = ["S105", "S106", "S108", "N803"]
# Fields ending in *_secret hold the NAME of a secret resolved at runtime, never the secret value.
"src/oplia_ctl/config.py" = ["S105"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["oplia_ctl"]
mypy_path = "src"
